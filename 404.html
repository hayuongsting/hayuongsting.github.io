<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Daily English Practice đã chuyển sang lexiphoria.github.io</title>
    <link rel="canonical" href="https://lexiphoria.github.io/">
    <script>
        // Chuyển mọi đường dẫn cũ sang cùng đường dẫn ở địa chỉ mới.
        // Nếu trình duyệt có tiến độ học tập lưu ở địa chỉ cũ thì mang theo qua migrate.html,
        // vì dữ liệu localStorage gắn với từng tên miền và không tự sang được.
        (function () {
            var NEW = 'https://lexiphoria.github.io';
            var to = location.pathname + location.search + location.hash;
            var data = {};
            try {
                for (var i = 0; i < localStorage.length; i++) {
                    var k = localStorage.key(i);
                    data[k] = localStorage.getItem(k);
                }
            } catch (e) { /* trình duyệt chặn lưu trữ: chỉ chuyển trang */ }

            var payload = encodeURIComponent(JSON.stringify(data));
            if (Object.keys(data).length && payload.length < 1500000) {
                location.replace(NEW + '/migrate.html#to=' + encodeURIComponent(to) + '&data=' + payload);
            } else {
                location.replace(NEW + to);
            }
        })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=https://lexiphoria.github.io/"></noscript>
</head>

<body>
    <p>Trang đã chuyển sang <a href="https://lexiphoria.github.io/">lexiphoria.github.io</a>.</p>
</body>

</html>
